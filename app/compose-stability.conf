// Compose compiler stability configuration (D-A39).
// Types listed here are treated as stable, so composables taking them (or models holding them) skip on equals()
// rather than only on the same instance. Only immutable value types and the read-only collection interfaces belong
// here; the app never mutates a list or map after handing it to the UI (state is rebuilt, not edited in place).

// java.time: immutable value classes with content equals().
java.time.Instant
java.time.LocalDate
java.time.LocalDateTime
java.time.LocalTime
java.time.YearMonth
java.time.ZonedDateTime
java.time.ZoneId
java.time.ZoneOffset
java.time.Duration
java.time.Period

// Read-only collection interfaces.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// The app's display formatter: all-val public surface, built once per preferences change and never mutated
// (its private NumberFormats are only read). Equality stays identity, so this only lets the UiStates that hold one
// be treated as stable.
io.github.conchad.smartgarage.core.format.Formatter
